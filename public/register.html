<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash Flow — Crear cuenta</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="panel auth-card">
      <div class="panel-header">Cash Flow — Crear cuenta</div>
      <form id="register-form" class="auth-form" novalidate>
        <div class="field">
          <label for="name">Nombre</label>
          <input class="input" id="name" name="name" type="text" placeholder="Tu nombre" required autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" placeholder="tu@email.com" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input class="input" id="password" name="password" type="password" placeholder="Mínimo 8 caracteres" required minlength="8" autocomplete="new-password">
        </div>
        <p id="error" class="error-text" hidden></p>
        <button type="submit" id="submit-btn" class="btn btn-primary auth-submit">Crear cuenta</button>
        <p class="auth-switch">¿Ya tenés cuenta? <a href="/login.html" class="auth-link">Iniciar sesión</a></p>
      </form>
    </div>
  </div>
  <script type="module" src="/js/pages/register.js"></script>
</body>
</html>
